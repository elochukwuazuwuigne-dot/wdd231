<body class="contact-page">
    
<header>

    <button id="menu-button" aria-label="Open Navigation Menu" aria-expanded="false">
        ☰
    </button>

    <nav id="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="anime.html">Anime Collection</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

</header>

<main>
    

    <section class="hero">
        <div class="hero-content">
            <h1>Contact Us</h1>
            <p>Share your favorite anime or send recommendations.</p>
        </div>
    </section>

    <!-- FORM -->
    <section class="contact-form">

        <form action="thankyou.html" method="get">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="favorite">Favorite Anime</label>
            <input type="text" id="favorite" name="favorite" required>

            <label for="genre">Preferred Genre</label>
            <select id="genre" name="genre" required>
                <option value="">Select</option>
                <option value="Action">Action</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Romance">Romance</option>
                <option value="Comedy">Comedy</option>
                <option value="Sports">Sports</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">Submit</button>

        </form>

    </section>

</main>

<footer>

    <p>

    </p>
